<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { background:#0b0b0b; color:#eee; font-family:Arial; padding:20px;}
.container { max-width:900px; margin:auto; }
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
</style>
</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard (Real Data)</h1>

<div class="card">
<h3>Market Data</h3>
NVDA: <span id="nvda"></span><br>
SOXX: <span id="soxx"></span><br>
VIX: <span id="vix"></span><br>
OIL: <span id="oil"></span><br>
Updated: <span id="time"></span>
</div>

<div class="card">
<h3>Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Decision</h3>
<div id="decision"></div>
</div>

<script>

async function loadData(){

    let res = await fetch("data.json");
    let d = await res.json();

    document.getElementById("nvda").innerText = d.nvda;
    document.getElementById("soxx").innerText = d.soxx;
    document.getElementById("vix").innerText = d.vix;
    document.getElementById("oil").innerText = d.oil;
    document.getElementById("time").innerText = d.updated;

    // ===== SIGNALS =====

    let soxxSignal = d.soxxChange > 0 ? 1 : -1;
    let nvdaSignal = d.nvdaChange > 5 ? -1 : 1;
    let vixSignal = d.vix > 25 ? -1 : 0;
    let oilSignal = d.oil > 95 ? -0.5 : 0;

    let score =
        0.4 * soxxSignal +
        0.3 * nvdaSignal +
        0.2 * vixSignal +
        0.1 * oilSignal;

    let signals = [];

    if(nvdaSignal === -1) signals.push("AI overheating (NVDA)");
    if(soxxSignal === -1) signals.push("Semiconductors weakening");
    if(vixSignal === -1) signals.push("High market fear (VIX)");
    if(oilSignal < 0) signals.push("Geopolitical stress");

    let decision = "";
    let cls = "";

    if(score < -0.5){
        decision = "EXIT";
        cls = "exit";
    } else if(score < 0){
        decision = "WARNING";
        cls = "warning";
    } else if(score < 0.5){
        decision = "HOLD (Late)";
        cls = "warning";
    } else {
        decision = "HOLD (Strong)";
        cls = "hold";
    }

    document.getElementById("signals").innerHTML =
        signals.join("<br>") || "No major signals";

    document.getElementById("decision").innerHTML =
        `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;
}

loadData();

</script>

</body>
</html>
