<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { background:#0b0b0b; color:#eee; font-family:Arial; padding:20px;}
.container { max-width:900px; margin:auto; }
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
.small { color:#aaa; font-size:13px;}
</style>

</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard (Real Data)</h1>

<div class="card">
<h3>Market Data</h3>
NVDA: <span id="nvda"></span><br>
SOXX: <span id="soxx"></span><br>
VIX: <span id="vix"></span><br>
OIL: <span id="oil"></span><br>
Updated: <span id="time"></span>
</div>

<div class="card">
<h3>Indicator Interpretation</h3>

<b>SOXX (40%)</b><br>
<span id="soxxExplain"></span><br><br>

<b>NVDA (30%)</b><br>
<span id="nvdaExplain"></span><br><br>

<b>VIX (20%)</b><br>
<span id="vixExplain"></span><br><br>

<b>OIL (10%)</b><br>
<span id="oilExplain"></span>

</div>

<div class="card">
<h3>Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Decision</h3>
<div id="decision"></div>
</div>

</div>

<script>

async function loadData(){

    try {

        // ✅ cache bypass
        let res = await fetch("data.json?t=" + new Date().getTime());
        let d = await res.json();

        // ✅ turvallinen numeric conversion
        let nvda = parseFloat(d.nvda);
        let soxx = parseFloat(d.soxx);
        let nvdaChange = parseFloat(d.nvdaChange);
        let soxxChange = parseFloat(d.soxxChange);
        let vix = parseFloat(d.vix);
        let oil = parseFloat(d.oil);

        // ✅ turvacheck
        if(isNaN(nvdaChange) || isNaN(soxxChange)){
            throw new Error("Invalid data values");
        }

        // ===== UI =====
        document.getElementById("nvda").innerText = nvda + " (" + nvdaChange.toFixed(2) + "%)";
        document.getElementById("soxx").innerText = soxx + " (" + soxxChange.toFixed(2) + "%)";
        document.getElementById("vix").innerText = vix;
        document.getElementById("oil").innerText = oil;
        document.getElementById("time").innerText = d.updated;

        // ===== SIGNALS =====
        let soxxSignal = soxxChange > 0 ? 1 : -1;
        let nvdaSignal = nvdaChange > 5 ? -1 : 1;
        let vixSignal = vix > 25 ? -1 : 0;
        let oilSignal = oil > 95 ? -0.5 : 0;

        let score =
            0.4 * soxxSignal +
            0.3 * nvdaSignal +
            0.2 * vixSignal +
            0.1 * oilSignal;

        // ===== EXPLANATIONS =====

        document.getElementById("soxxExplain").innerText =
            soxxSignal > 0
            ? "Semiconductor trend strong → demand intact"
            : "Semiconductors weakening → early cycle warning";

        document.getElementById("nvdaExplain").innerText =
            nvdaSignal > 0
            ? "Healthy AI growth (no overheating)"
            : "AI overheating → late cycle risk";

        document.getElementById("vixExplain").innerText =
            vixSignal === 0
            ? "Low volatility → stable market"
            : "High volatility → risk-off environment";

        document.getElementById("oilExplain").innerText =
            oilSignal === 0
            ? "No major geopolitical stress"
            : "Oil spike → geopolitical risk";

        // ===== SIGNAL LIST =====
        let signals = [];

        if(nvdaSignal === -1) signals.push("AI overheating (NVDA)");
        if(soxxSignal === -1) signals.push("Semiconductors weakening");
        if(vixSignal === -1) signals.push("High market fear (VIX)");
        if(oilSignal < 0) signals.push("Geopolitical stress");

        let defaultMsg;

        if(score > 0.5){
            defaultMsg = "Strong trend (no signs of cycle turning)";
        } else if(score > 0){
            defaultMsg = "Late-cycle trend → monitor closely";
        } else {
            defaultMsg = "No major signals yet";
        }

        document.getElementById("signals").innerHTML =
            signals.length ? signals.join("<br>") : defaultMsg;

        // ===== DECISION =====
        let decision = "";
        let cls = "";

        if(score < -0.5){
            decision = "EXIT";
            cls = "exit";
        } else if(score < 0){
            decision = "WARNING";
            cls = "warning";
        } else if(score < 0.5){
            decision = "HOLD (Late)";
            cls = "warning";
        } else {
            decision = "HOLD (Strong)";
            cls = "hold";
        }

        document.getElementById("decision").innerHTML =
            `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;

    } catch (err) {

        console.error(err);

        document.getElementById("signals").innerHTML = "❌ Error loading data";
        document.getElementById("decision").innerHTML = "Check console (F12)";
    }
}

loadData();

</script>

</body>
</html>
