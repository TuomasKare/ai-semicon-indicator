<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { font-family: Arial; background:#0b0b0b; color:#eee; padding:20px;}
.container { max-width:900px; margin:auto; }
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
.live { color:#00ffaa; }
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
</style>
</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard</h1>

<div class="card">
<h3>Market Data</h3>
NVDA: <span id="nvda">Loading...</span><br>
SOXX: <span id="soxx">Loading...</span><br>
VIX: <span id="vix">Loading...</span><br>
DXY: <span id="dxy">Loading...</span><br>
OIL: <span id="oil">Loading...</span>
</div>

<div class="card">
<h3>Signals</h3>
<div id="signals">Loading...</div>
</div>

<div class="card">
<h3>Decision</h3>
<div id="decision"></div>
</div>

</div>

<script>

// ✅ proxy (fixaa sinun ongelman)
const proxy = "https://api.allorigins.win/raw?url=";

async function fetchData(symbol){
    let url = proxy + encodeURIComponent(
        `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1mo&interval=1d`
    );

    let res = await fetch(url);
    let data = await res.json();

    let prices = data.chart.result[0].indicators.quote[0].close;
    let valid = prices.filter(p => p !== null);

    let first = valid[0];
    let last = valid[valid.length-1];

    let change = ((last-first)/first)*100;

    return { price:last, change:change };
}

async function load(){

    try{

        let nvda = await fetchData("NVDA");
        let soxx = await fetchData("SOXX");
        let vix = await fetchData("^VIX");
        let dxy = await fetchData("DX-Y.NYB");
        let oil = await fetchData("CL=F");

        // Display
        document.getElementById("nvda").innerText = nvda.price.toFixed(2)+" ("+nvda.change.toFixed(1)+"%)";
        document.getElementById("soxx").innerText = soxx.price.toFixed(2)+" ("+soxx.change.toFixed(1)+"%)";
        document.getElementById("vix").innerText = vix.price.toFixed(2);
        document.getElementById("dxy").innerText = dxy.price.toFixed(2);
        document.getElementById("oil").innerText = oil.price.toFixed(2);

        // SCORE
        let score = 0;
        let signals = [];

        // NVDA
        if(nvda.change > 25){
            score -= 1;
            signals.push("NVDA parabolic");
        } else if(nvda.change > 10){
            score -= 0.5;
        } else {
            score += 0.5;
        }

        // SOXX
        if(soxx.change < -10){
            score -= 1;
            signals.push("Semis breaking down");
        } else if(soxx.change > 10){
            score += 1;
        }

        // VIX
        if(vix.price > 25){
            score -= 1;
            signals.push("High fear (VIX)");
        }

        // DXY
        if(dxy.change > 3){
            score -= 0.5;
            signals.push("Dollar rising");
        }

        // Oil
        if(oil.change > 10){
            score -= 0.5;
            signals.push("Oil spike (geo risk)");
        }

        // Decision
        let decision = "";
        let cls = "";

        if(score <= -2){
            decision = "EXIT";
            cls = "exit";
        } else if(score <= -1){
            decision = "WARNING";
            cls = "warning";
        } else {
            decision = "HOLD";
            cls = "hold";
        }

        document.getElementById("signals").innerHTML = signals.join("<br>") || "No risks";
        document.getElementById("decision").innerHTML = `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;

    } catch(e){
        document.getElementById("signals").innerText = "ERROR loading data";
        console.error(e);
    }
}

load();

</script>

</body>
</html>
