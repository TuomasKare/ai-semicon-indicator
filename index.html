<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { background:#0b0b0b; color:#eee; font-family:Arial; padding:20px;}
.container { max-width:1200px; margin:auto; }
.card { background:#161616; padding:15px; margin:12px 0; border-radius:10px;}
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
.small { color:#aaa; font-size:13px;}
.grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px;}
</style>
</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard</h1>

<!-- ===================================================== -->
<!-- CORE EXIT INDICATOR -->
<!-- ===================================================== -->

<div class="card">
<h2>CORE Exit Indicator</h2>
NVDA: <span id="nvda"></span><br>
SOXX: <span id="soxx"></span><br>
VIX: <span id="vix"></span><br>
OIL: <span id="oil"></span><br>
Updated: <span id="time"></span>
</div>

<div class="card">
<h3>Core Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Final Decision</h3>
<div id="decision"></div>
</div>

<div class="card">
<h3>Score Breakdown</h3>
<div id="scoreExplain"></div>
<div class="small">
0.4×SOXX + 0.3×NVDA + 0.2×VIX + 0.1×OIL
</div>
</div>

<!-- ===================================================== -->
<!-- AI MACRO INDICATORS -->
<!-- ===================================================== -->

<div class="card">
<h2>AI Macro Indicator Monitor</h2>
<div id="aiIndicators" class="grid"></div>
</div>

</div>

<script>

/* =====================================================
   CORE EXIT INDICATOR (data.json)
===================================================== */

async function loadCore(){

    const res = await fetch("data.json?t=" + Date.now());
    const d = await res.json();

    const nvda = parseFloat(d.nvda);
    const soxx = parseFloat(d.soxx);
    const nvdaCh = parseFloat(d.nvdaChange);
    const soxxCh = parseFloat(d.soxxChange);
    const vix = parseFloat(d.vix);
    const oil = parseFloat(d.oil);

    document.getElementById("nvda").innerText = nvda + " (" + nvdaCh.toFixed(2) + "%)";
    document.getElementById("soxx").innerText = soxx + " (" + soxxCh.toFixed(2) + "%)";
    document.getElementById("vix").innerText = vix;
    document.getElementById("oil").innerText = oil;
    document.getElementById("time").innerText = d.updated;

    const soxxSignal = soxxCh > 0 ? 1 : -1;
    const nvdaSignal = nvdaCh > 5 ? -1 : 1;
    const vixSignal = vix > 25 ? -1 : 0;
    const oilSignal = oil > 95 ? -0.5 : 0;

    const score =
        0.4 * soxxSignal +
        0.3 * nvdaSignal +
        0.2 * vixSignal +
        0.1 * oilSignal;

    let signals = [];
    if(nvdaSignal === -1) signals.push("AI overheating (NVDA)");
    if(soxxSignal === -1) signals.push("Semiconductors weakening");
    if(vixSignal === -1) signals.push("Market risk rising (VIX)");
    if(oilSignal < 0) signals.push("Geopolitical stress");

    document.getElementById("signals").innerHTML =
        signals.length ? signals.join("<br>") : "No major warning signals";

    let decision, cls;
    if(score < -0.5){ decision="EXIT"; cls="exit"; }
    else if(score < 0){ decision="WARNING"; cls="warning"; }
    else if(score < 0.5){ decision="HOLD (Late Cycle)"; cls="warning"; }
    else { decision="HOLD (Strong)"; cls="hold"; }

    document.getElementById("decision").innerHTML =
        `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;

    document.getElementById("scoreExplain").innerHTML =
        `SOXX: ${(0.4*soxxSignal).toFixed(2)}<br>
         NVDA: ${(0.3*nvdaSignal).toFixed(2)}<br>
         VIX: ${(0.2*vixSignal).toFixed(2)}<br>
         OIL: ${(0.1*oilSignal).toFixed(2)}<br><br>
         <b>Total: ${score.toFixed(2)}</b>`;
}

/* =====================================================
   AI MACRO INDICATORS (definitions + values)
===================================================== */

async function loadAIMacro(){

    const defRes = await fetch("ai_macro_indicators.json");
    const defs = await defRes.json();

    const valRes = await fetch("ai_macro_values.json?t=" + Date.now());
    const vals = await valRes.json();

    const container = document.getElementById("aiIndicators");
    container.innerHTML = "";

    defs.forEach(item => {

        const v = vals.values[item.ticker];
        if(!v) return;

        const div = document.createElement("div");
        div.className = "card";

        const changeColor = v.change >= 0 ? "lime" : "orange";

        div.innerHTML = `
            <b>${item.ticker}</b> — ${item.name}<br>
            <span style="color:${changeColor}">
                ${v.price} (${v.change.toFixed(2)}%)
            </span><br>
            <span class="small">
                ${item.category}<br>
                Metric: ${item.evaluate_metric}<br>
                ${item.logic}
            </span>
        `;

        container.appendChild(div);
    });
}

/* ===================================================== */

loadCore();
loadAIMacro();

</script>

</body>
</html>
