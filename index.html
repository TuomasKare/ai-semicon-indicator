<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Semiconductor Exit System (AUTO)</title>

<style>
body { font-family: Arial; background:#0b0b0b; color:#eee; padding:20px;}
.container { max-width:1000px; margin:auto; }
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
h1 { color:#00d4ff; }
.live { color:#00ffaa; font-weight:bold;}
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
.small { font-size:12px; color:#aaa;}
</style>
</head>

<body>
<div class="container">

<h1>AI Semiconductor EXIT Dashboard (Fully Auto)</h1>

<div class="card">
<h3>Market Data</h3>
NVDA: <span id="nvda" class="live"></span><br>
SOXX (Semi ETF): <span id="soxx" class="live"></span><br>
VIX (Fear): <span id="vix" class="live"></span><br>
DXY (USD): <span id="dxy" class="live"></span><br>
Oil: <span id="oil" class="live"></span>
</div>

<div class="card">
<h3>Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Final Decision</h3>
<div id="score"></div>
<div id="decision"></div>
</div>

</div>

<script>
// ========= FETCH FUNCTION =========
async function fetchData(symbol){
    let url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1mo&interval=1d`;
    let res = await fetch(url);
    let data = await res.json();

    let prices = data.chart.result[0].indicators.quote[0].close;
    let valid = prices.filter(p => p !== null);

    let first = valid[0];
    let last = valid[valid.length-1];

    let change = ((last-first)/first)*100;

    return { price:last, change:change };
}

// ========= LOAD ALL =========
async function load(){

    let nvda = await fetchData("NVDA");
    let soxx = await fetchData("SOXX");
    let vix = await fetchData("^VIX");
    let dxy = await fetchData("DX-Y.NYB");
    let oil = await fetchData("CL=F");

    // DISPLAY
    document.getElementById("nvda").innerText = nvda.price.toFixed(2) + " (" + nvda.change.toFixed(1) + "%)";
    document.getElementById("soxx").innerText = soxx.price.toFixed(2) + " (" + soxx.change.toFixed(1) + "%)";
    document.getElementById("vix").innerText = vix.price.toFixed(2);
    document.getElementById("dxy").innerText = dxy.price.toFixed(2);
    document.getElementById("oil").innerText = oil.price.toFixed(2);

    // ========= SIGNAL LOGIC =========

    let signals = [];
    let score = 0;

    // 1. NVDA PARABOLIC
    if(nvda.change > 25){
        signals.push("NVDA parabolic → bubble risk");
        score -= 1;
    } else if(nvda.change > 10){
        score -= 0.5;
    } else {
        score += 0.5;
    }

    // 2. SEMICONDUCTOR TREND (SOXX)
    if(soxx.change < -10){
        signals.push("Semiconductors breaking down");
        score -= 1;
    } else if(soxx.change > 10){
        score += 1;
    }

    // 3. VOLATILITY (VIX)
    if(vix.price > 25){
        signals.push("Market fear high (VIX)");
        score -= 1;
    }

    // 4. DOLLAR (macro tightening)
    if(dxy.change > 3){
        signals.push("Dollar rising → liquidity tightening");
        score -= 0.5;
    }

    // 5. OIL (geopolitical stress proxy)
    if(oil.change > 10){
        signals.push("Oil spike → geopolitical risk");
        score -= 0.5;
    }

    // ========= FINAL SCORE =========
    let decision = "";
    let cls = "";

    if(score <= -2){
        decision = "EXIT (High probability top)";
        cls = "exit";
    } else if(score <= -1){
        decision = "WARNING (Reduce exposure)";
        cls = "warning";
    } else {
        decision = "HOLD";
        cls = "hold";
    }

    // OUTPUT
    document.getElementById("signals").innerHTML = signals.join("<br>") || "No major warnings";
    document.getElementById("score").innerHTML = "Score: " + score.toFixed(2);
    document.getElementById("decision").innerHTML = "<span class='"+cls+"'>" + decision + "</span>";
}

// Run
load();
</script>

</body>
</html>
