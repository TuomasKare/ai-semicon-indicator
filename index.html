<!DOCTYPE html>
<html>
<head>
  <title>AI Semiconductor Indicator</title>
  <style>
    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .box {
      margin-top: 40px;
      padding: 20px;
      border: 1px solid #333;
      display: inline-block;
    }

    .score {
      font-size: 40px;
      margin: 10px 0;
    }

    .label {
      font-size: 20px;
    }

    .trend {
      font-size: 14px;
      margin-top: 5px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="label">CORE EXIT INDICATOR</div>
    <div id="score" class="score">...</div>
    <div id="status" class="label"></div>
    <div id="trend" class="trend"></div>
  </div>

  <script>
    function calculateScore(data) {
      const soxx = data.soxxChange > 0 ? 1 : -1;
      const nvda = data.nvdaChange > 5 ? -1 : 1;
      const vix = data.vix > 25 ? -1 : 0;
      const oil = data.oil > 95 ? -0.5 : 0;

      return (
        0.4 * soxx +
        0.3 * nvda +
        0.2 * vix +
        0.1 * oil
      );
    }

    function getLabel(score) {
      if (score > 0.5) return "HOLD (Strong)";
      if (score > 0) return "HOLD (Late)";
      if (score >= -0.5) return "WARNING";
      return "EXIT";
    }

    async function loadHistory() {
      try {
        const res = await fetch("history.json?t=" + Date.now());
        return await res.json();
      } catch {
        return [];
      }
    }

    function getTrend(history) {
      if (history.length < 5) return "Trend: N/A";

      const latest = history[history.length - 1].coreScore;
      const past = history[history.length - 5].coreScore;

      if (latest > past) return "Trend: ↑ Improving";
      if (latest < past) return "Trend: ↓ Weakening";
      return "Trend: → Flat";
    }

    async function loadData() {
      const res = await fetch("data.json?t=" + Date.now());
      const data = await res.json();

      const history = await loadHistory();

      const score = calculateScore(data);
      const label = getLabel(score);
      const trend = getTrend(history);

      document.getElementById("score").innerText = score.toFixed(2);
      document.getElementById("status").innerText = label;
      document.getElementById("trend").innerText = trend;
    }

    loadData();
  </script>

</body>
</html>
