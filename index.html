<script>

async function loadData(){

    let res = await fetch("data.json?t=" + new Date().getTime());
    let d = await res.json();

    // ✅ CONVERT TO NUMBER (TÄMÄ OLI PUUTTUVA)
    let nvdaChange = parseFloat(d.nvdaChange);
    let soxxChange = parseFloat(d.soxxChange);
    let vix = parseFloat(d.vix);
    let oil = parseFloat(d.oil);

    // display data
    document.getElementById("nvda").innerText = d.nvda + " (" + nvdaChange.toFixed(2) + "%)";
    document.getElementById("soxx").innerText = d.soxx + " (" + soxxChange.toFixed(2) + "%)";
    document.getElementById("vix").innerText = vix;
    document.getElementById("oil").innerText = oil;
    document.getElementById("time").innerText = d.updated;

    // ===== SIGNALS =====

    let soxxSignal = soxxChange > 0 ? 1 : -1;
    let nvdaSignal = nvdaChange > 5 ? -1 : 1;
    let vixSignal = vix > 25 ? -1 : 0;
    let oilSignal = oil > 95 ? -0.5 : 0;

    let score =
        0.4 * soxxSignal +
        0.3 * nvdaSignal +
        0.2 * vixSignal +
        0.1 * oilSignal;

    // ===== EXPLANATIONS =====

    document.getElementById("soxxExplain").innerText =
        soxxSignal > 0
        ? "Semiconductor trend strong → demand intact"
        : "Semiconductors weakening → early cycle warning";

    document.getElementById("nvdaExplain").innerText =
        nvdaSignal > 0
        ? "Healthy AI growth (not overheated)"
        : "AI overheating → late cycle risk";

    document.getElementById("vixExplain").innerText =
        vixSignal === 0
        ? "Low volatility → stable market"
        : "High volatility → risk-off environment";

    document.getElementById("oilExplain").innerText =
        oilSignal === 0
        ? "No major geopolitical stress"
        : "Oil spike → geopolitical risk";

    // ===== SIGNAL LIST =====

    let signals = [];

    if(nvdaSignal === -1) signals.push("AI overheating (NVDA)");
    if(soxxSignal === -1) signals.push("Semiconductors weakening (CRITICAL)");
    if(vixSignal === -1) signals.push("Market risk rising (VIX)");
    if(oilSignal < 0) signals.push("Geopolitical stress");

    let defaultMsg;

    if(score > 0.5){
        defaultMsg = "Strong trend (no signs of cycle turning)";
    } else if(score > 0){
        defaultMsg = "Late-cycle trend → monitor closely";
    } else {
        defaultMsg = "No major signals yet";
    }

    document.getElementById("signals").innerHTML =
        signals.length ? signals.join("<br>") : defaultMsg;

    // ===== FINAL DECISION =====

    let decision = "";
    let cls = "";

    if(score < -0.5){
        decision = "EXIT";
        cls = "exit";
    } else if(score < 0){
        decision = "WARNING";
        cls = "warning";
    } else if(score < 0.5){
        decision = "HOLD (Late Cycle)";
        cls = "warning";
    } else {
        decision = "HOLD (Strong)";
        cls = "hold";
    }

    document.getElementById("decision").innerHTML =
        `<span class="${cls}">
        ${decision} (score ${score.toFixed(2)})
        </span>`;
}

loadData();

</script>
