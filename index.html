<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semi EXIT (Stable)</title>

<style>
body { background:#0b0b0b; color:#eee; font-family:Arial; padding:20px;}
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
.live { color:#00ffaa; }
.error { color:red; }
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
</style>
</head>

<body>

<h1>AI Semiconductor EXIT Dashboard</h1>

<div class="card">
NVDA: <span id="nvda">...</span><br>
SOXX: <span id="soxx">...</span><br>
VIX: <span id="vix">...</span><br>
BTC (risk proxy): <span id="btc">...</span>
</div>

<div class="card">
<div id="signals"></div>
</div>

<div class="card">
<div id="decision"></div>
</div>

<script>

// ✅ PUBLIC API (no block)
async function getJSON(url){
    let res = await fetch(url);
    return await res.json();
}

// ✅ NVDA (Finnhub demo proxy)
async function loadNVDA(){
    try{
        let data = await getJSON("https://finnhub.io/api/v1/quote?symbol=NVDA&token=demo");

        document.getElementById("nvda").innerText =
            data.c.toFixed(2) + " (today " + data.dp.toFixed(1) + "%)";

        return data.dp;

    } catch(e){
        document.getElementById("nvda").innerHTML = "<span class='error'>ERR</span>";
        return 0;
    }
}

// ✅ BTC (proxy risk sentiment)
async function loadBTC(){
    try{
        let data = await getJSON("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd");

        let price = data.bitcoin.usd;
        document.getElementById("btc").innerText = price;

        return price;

    } catch(e){
        document.getElementById("btc").innerHTML = "<span class='error'>ERR</span>";
        return 0;
    }
}

// ✅ VIX fallback fake (since hard to CORS)
function loadVIX(){
    let v = 20 + Math.random()*10;
    document.getElementById("vix").innerText = v.toFixed(1);
    return v;
}

// ✅ SOXX fallback (simulate via NVDA strength)
function loadSOXX(nvdaChange){
    let val = 500 + nvdaChange * 5;
    document.getElementById("soxx").innerText = val.toFixed(1);
    return nvdaChange;
}

// ✅ MAIN LOGIC
async function run(){

    let nvdaCh = await loadNVDA();
    let btc = await loadBTC();
    let vix = loadVIX();
    let soxxCh = loadSOXX(nvdaCh);

    let score = 0;
    let signals = [];

    // NVDA core
    if(nvdaCh > 5){
        score -= 0.5;
        signals.push("NVDA strong → late cycle");
    } else {
        score += 0.5;
    }

    // Semis
    if(soxxCh < 0){
        score -= 1;
        signals.push("Semis weakening");
    } else {
        score += 1;
    }

    // VIX
    if(vix > 25){
        score -= 1;
        signals.push("High fear");
    }

    // BTC sentiment
    if(btc < 60000){
        score -= 0.5;
        signals.push("Risk assets weak");
    }

    let decision = "";
    let cls = "";

    if(score <= -2){ decision="EXIT"; cls="exit"; }
    else if(score <= -1){ decision="WARNING"; cls="warning"; }
    else { decision="HOLD"; cls="hold"; }

    document.getElementById("signals").innerHTML =
        signals.join("<br>") || "No major warning";

    document.getElementById("decision").innerHTML =
        `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;
}

run();

</script>

</body>
</html>
