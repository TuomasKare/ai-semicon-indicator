<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { background:#0b0b0b; color:#eee; font-family:Arial; padding:20px;}
.container { max-width:1200px; margin:auto; }
.card { background:#161616; padding:15px; margin:12px 0; border-radius:10px;}
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
.small { color:#aaa; font-size:13px;}
.grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px;}
</style>
</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard</h1>

<!-- ================= CORE EXIT INDICATOR ================= -->

<div class="card">
<h2>CORE Exit Indicator</h2>
NVDA: <span id="nvda"></span><br>
SOXX: <span id="soxx"></span><br>
VIX: <span id="vix"></span><br>
OIL: <span id="oil"></span><br>
Updated: <span id="time"></span>
</div>

<div class="card">
<h3>Core Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Final Decision</h3>
<div id="decision"></div>
</div>

<div class="card">
<h3>Score Breakdown</h3>
<div id="scoreExplain"></div>
</div>

<!-- ================= AI MACRO MONITOR ================= -->

<div class="card">
<h2>AI Macro Indicator Monitor</h2>
<div id="aiIndicators" class="grid"></div>
</div>

<div class="card">
<h2>AI Macro Score</h2>
<div id="macroScore"></div>
<div id="macroBreakdown" class="small"></div>
</div>

</div>

<script>

/* ================= CORE EXIT SCORE ================= */

async function loadCore(){
    const d = await (await fetch("data.json?t=" + Date.now())).json();

    const nvdaCh = +d.nvdaChange;
    const soxxCh = +d.soxxChange;
    const vix = +d.vix;
    const oil = +d.oil;

    document.getElementById("nvda").innerText = `${d.nvda} (${nvdaCh.toFixed(2)}%)`;
    document.getElementById("soxx").innerText = `${d.soxx} (${soxxCh.toFixed(2)}%)`;
    document.getElementById("vix").innerText = vix;
    document.getElementById("oil").innerText = oil;
    document.getElementById("time").innerText = d.updated;

    const soxxSignal = soxxCh > 0 ? 1 : -1;
    const nvdaSignal = nvdaCh > 5 ? -1 : 1;
    const vixSignal = vix > 25 ? -1 : 0;
    const oilSignal = oil > 95 ? -0.5 : 0;

    const score =
        0.4*soxxSignal + 0.3*nvdaSignal + 0.2*vixSignal + 0.1*oilSignal;

    document.getElementById("decision").innerHTML =
        score > 0.5 ? `<span class="hold">HOLD (Strong) (${score.toFixed(2)})</span>` :
        score > 0 ? `<span class="warning">HOLD (Late) (${score.toFixed(2)})</span>` :
        score > -0.5 ? `<span class="warning">WARNING (${score.toFixed(2)})</span>` :
        `<span class="exit">EXIT (${score.toFixed(2)})</span>`;
}

/* ================= AI MACRO SCORE ================= */

async function loadAIMacro(){
    const defs = await (await fetch("ai_macro_indicators.json")).json();
    const vals = await (await fetch("ai_macro_values.json?t=" + Date.now())).json();

    const groups = {
        hardware: [],
        hyperscalers: [],
        etfs: [],
        macro: []
    };

    defs.forEach(d => {
        const v = vals.values[d.ticker];
        if(!v) return;

        const score = v.change > 0 ? 1 : v.change < 0 ? -1 : 0;

        if(d.category.includes("Semiconductor") || d.category.includes("AI / GPU"))
            groups.hardware.push(score);
        else if(d.category.includes("Cloud") || d.category.includes("Software"))
            groups.hyperscalers.push(score);
        else if(d.category.includes("ETF"))
            groups.etfs.push(score);
        else
            groups.macro.push(score);

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
            <b>${d.ticker}</b><br>
            ${v.price} (${v.change.toFixed(2)}%)<br>
            <span class="small">${d.category}</span>
        `;
        document.getElementById("aiIndicators").appendChild(div);
    });

    const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

    const hw = avg(groups.hardware);
    const hs = avg(groups.hyperscalers);
    const et = avg(groups.etfs);
    const ma = avg(groups.macro);

    const macroScore =
        0.4*hw + 0.25*hs + 0.2*et + 0.15*ma;

    document.getElementById("macroScore").innerHTML =
        macroScore > 0.5 ? `<span class="hold">Strong AI Breadth (${macroScore.toFixed(2)})</span>` :
        macroScore > 0 ? `<span class="warning">Late AI Cycle (${macroScore.toFixed(2)})</span>` :
        `<span class="exit">Weak / Narrow AI (${macroScore.toFixed(2)})</span>`;

    document.getElementById("macroBreakdown").innerHTML = `
        Hardware: ${(0.4*hw).toFixed(2)}<br>
        Hyperscalers: ${(0.25*hs).toFixed(2)}<br>
        ETFs: ${(0.2*et).toFixed(2)}<br>
        Macro: ${(0.15*ma).toFixed(2)}<br><br>
        <b>Total Macro Score: ${macroScore.toFixed(2)}</b>
    `;
}

loadCore();
loadAIMacro();

</script>

</body>
</html>
