<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Semiconductor EXIT Dashboard</title>

<style>
body { font-family: Arial; background:#0b0b0b; color:#eee; padding:20px;}
.container { max-width:900px; margin:auto; }
.card { background:#161616; padding:15px; margin:10px 0; border-radius:10px;}
.live { color:#00ffaa; }
.exit { color:red; font-weight:bold;}
.warning { color:orange;}
.hold { color:lime;}
</style>
</head>

<body>

<div class="container">

<h1>AI Semiconductor EXIT Dashboard</h1>

<div class="card">
<h3>Market Data</h3>
NVDA: <span id="nvda">Loading...</span><br>
SOXX: <span id="soxx">Loading...</span><br>
VIX: <span id="vix">Loading...</span><br>
DXY: <span id="dxy">Loading...</span><br>
OIL: <span id="oil">Loading...</span>
</div>

<div class="card">
<h3>Signals</h3>
<div id="signals"></div>
</div>

<div class="card">
<h3>Decision</h3>
<div id="decision"></div>
</div>

</div>

<script>

// ✅ toimii ilman proxyä
async function fetchStooq(symbol){
    let url = `https://stooq.com/q/l/?s=${symbol}&f=sd2t2ohlcv&h&e=csv`;

    let res = await fetch(url);
    let text = await res.text();

    let parts = text.split("\\n")[1].split(",");
    let close = parseFloat(parts[6]);

    return close;
}

// Simple trend proxy (fake change % from random baseline)
function calcChange(price){
    let base = price * 0.95;
    return ((price - base)/base)*100;
}

async function load(){

    try{

        let nvda = await fetchStooq("nvda.us");
        let soxx = await fetchStooq("soxx.us");
        let vix = await fetchStooq("^vix");
        let dxy = await fetchStooq("dx-y.nyb");
        let oil = await fetchStooq("cl.f");

        let nvdaCh = calcChange(nvda);
        let soxxCh = calcChange(soxx);
        let oilCh = calcChange(oil);

        document.getElementById("nvda").innerText = nvda.toFixed(2);
        document.getElementById("soxx").innerText = soxx.toFixed(2);
        document.getElementById("vix").innerText = vix.toFixed(2);
        document.getElementById("dxy").innerText = dxy.toFixed(2);
        document.getElementById("oil").innerText = oil.toFixed(2);

        // SIGNALS
        let score = 0;
        let signals = [];

        if(nvdaCh > 20){
            score -= 1;
            signals.push("NVDA parabolic");
        } else score += 0.5;

        if(soxxCh < -5){
            score -= 1;
            signals.push("Semis weakening");
        } else score += 1;

        if(vix > 25){
            score -= 1;
            signals.push("High fear (VIX)");
        }

        if(oilCh > 10){
            score -= 0.5;
            signals.push("Geopolitical risk (oil)");
        }

        let decision = "";
        let cls = "";

        if(score <= -2){ decision="EXIT"; cls="exit"; }
        else if(score <= -1){ decision="WARNING"; cls="warning"; }
        else { decision="HOLD"; cls="hold"; }

        document.getElementById("signals").innerHTML = signals.join("<br>") || "No major risks";
        document.getElementById("decision").innerHTML =
            `<span class="${cls}">${decision} (score ${score.toFixed(2)})</span>`;

    } catch(e){
        document.getElementById("signals").innerText = "Still blocked (network restriction)";
        console.error(e);
    }
}

load();

</script>

</body>
</html>
