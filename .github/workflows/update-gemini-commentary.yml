name: Update Gemini Commentary

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-data-writers
  cancel-in-progress: false

jobs:
  update-commentary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini commentary update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_gemini_commentary.py

      - name: Commit updated commentary
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add commentary.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Gemini commentary"

          git fetch origin "${GITHUB_REF_NAME:-main}"
          git rebase "origin/${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
