name: Update AI Dashboard Data

on:
  schedule:
    - cron: "*/15 * * * *"   # Runs every 15 minutes
  workflow_dispatch:         # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        npm install node-fetch@2

    - name: Run CORE update
      run: node update.js

    - name: Run AI Macro update
      run: node update_ai_macro_values.js

    - name: Run VVSM ETF update
      run: node update_smh.js

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add data.json ai_macro_values.json smh.json
        git commit -m "Automated data update" || echo "No changes to commit"
        git push
