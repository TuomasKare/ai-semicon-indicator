name: Update AI Dashboard Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-branch-data-writers
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        npm install node-fetch@2

    - name: Run CORE update
      run: node update.js

    - name: Run AI Macro update
      run: node update_ai_macro_values.js

    - name: Run VVSM ETF update
      run: node update_smh.js

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add data.json ai_macro_values.json smh.json

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Automated data update"

        git fetch origin "${GITHUB_REF_NAME:-main}"
        git rebase "origin/${GITHUB_REF_NAME:-main}"
        git push origin "HEAD:${GITHUB_REF_NAME:-main}"
