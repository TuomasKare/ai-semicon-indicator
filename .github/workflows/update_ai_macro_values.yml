name: Update AI Macro Values

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: main-branch-data-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run AI macro update script
        run: node update_ai_macro_values.js

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ai_macro_values.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "auto: update AI macro values"

          git fetch origin "${GITHUB_REF_NAME:-main}"
          git rebase "origin/${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
